[package]
name = "maccleanup"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "A standalone native macOS cleanup utility"
license = "MIT"
repository = "https://github.com/dominicferri/MacCleanUp"
readme = "README.md"
keywords = ["macos", "cleanup", "disk-usage", "treemap", "egui"]
categories = ["gui", "filesystem", "os::macos-apis"]
publish = false

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
libc = "0.2"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lib]
name = "maccleanup"
path = "src/lib.rs"

[[bin]]
name = "MacCleanUp"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
